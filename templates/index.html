<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titanic Survival Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#e6c27a;--gold2:#c9954a;--ink:#eaf1ff;--muted:#9db3d3}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:Poppins,system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(#050b1a,#0e2748 55%,#16406b);overflow-x:hidden}
.stars{position:fixed;inset:0;animation:tw 4s ease-in-out infinite alternate;
  background-image:radial-gradient(1.5px 1.5px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 10%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 45% 28%,#fff,transparent),radial-gradient(1px 1px at 85% 32%,#fff,transparent),
  radial-gradient(1px 1px at 10% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 5%,#fff,transparent),
  radial-gradient(1px 1px at 32% 8%,#fff,transparent),radial-gradient(1px 1px at 92% 18%,#fff,transparent)}
@keyframes tw{to{opacity:.35}}
.moon{position:fixed;top:56px;right:9%;width:68px;height:68px;border-radius:50%;background:#fff6d8;
  box-shadow:0 0 60px 20px rgba(255,246,216,.22)}
.ship{position:fixed;left:50%;bottom:46px;width:min(1100px,135vw);transform:translateX(-50%);
  animation:bob 7s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateX(-50%) translateY(-9px) rotate(.5deg)}}
.waves{position:fixed;left:0;bottom:0;width:100%;height:130px;pointer-events:none;overflow:hidden}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wv 14s linear infinite}
.waves svg+svg{bottom:-14px;animation-duration:9s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-50%)}}

main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:34px 16px 220px}
h1{font-family:Cinzel,Georgia,serif;font-weight:600;font-size:clamp(26px,6vw,38px);color:var(--gold);
  text-align:center;letter-spacing:.04em}
.sub{text-align:center;color:var(--muted);font-weight:300;margin:6px 0 22px}
.card{background:rgba(8,20,42,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(230,194,122,.25);border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.f{margin-bottom:16px}
.f>label,.f>.l{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:7px}
.f b{color:var(--gold);font-weight:600}
input[type=text],input[type=number]{width:100%;padding:11px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.07);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,.seg input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--gold)}
.seg{display:flex;gap:8px}
.seg input{position:absolute;opacity:0}
.seg label{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.07);cursor:pointer;
  border:1px solid transparent;transition:transform .2s,background .2s;font-size:14px}
.seg input:checked+label{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1202;font-weight:600;transform:translateY(-2px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#go{width:100%;padding:14px;border:0;border-radius:14px;font:600 16px Poppins,sans-serif;color:#1a1202;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),var(--gold2));transition:transform .15s,box-shadow .15s}
#go:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(201,149,74,.4)}
#go:disabled{opacity:.6;cursor:wait}
#res{display:none;text-align:center;margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12)}
#res.show{display:block;animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.ring{--p:0;--c:#5be0a0;width:150px;height:150px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring span{width:118px;height:118px;border-radius:50%;background:#0b1f3d;display:grid;place-items:center;font-size:30px;font-weight:600}
#msg{font-size:17px;font-weight:600}
#note{color:var(--muted);font-size:13px;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stars"></div><div class="moon"></div>

<svg class="ship" viewBox="0 0 800 260" fill="#050d1c" aria-hidden="true">
  <defs><pattern id="w" width="14" height="12" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="6" height="4" rx="1" fill="#ffd27a"/></pattern>
  <g id="f"><rect y="50" width="34" height="85" rx="3"/><rect y="50" width="34" height="8" fill="#c9954a"/></g></defs>
  <g stroke="#050d1c" stroke-width="3"><line x1="130" y1="170" x2="130" y2="62"/><line x1="680" y1="170" x2="680" y2="78"/></g>
  <use href="#f" x="215"/><use href="#f" x="305"/><use href="#f" x="395"/><use href="#f" x="485"/>
  <rect x="140" y="128" width="520" height="44"/><rect x="200" y="108" width="400" height="22"/>
  <rect x="150" y="137" width="500" height="26" fill="url(#w)"/><rect x="210" y="112" width="380" height="14" fill="url(#w)"/>
  <path d="M30 168H770L735 224Q400 247 95 224Z"/><path d="M44 184H756" stroke="#c9954a" stroke-width="3"/>
</svg>

<div class="waves">
  <svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path fill="#0a2a4d" fill-opacity=".85" d="M0 55Q150 15 300 55T600 55T900 55T1200 55V120H0Z"/></svg>
  <svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path fill="#061a33" d="M0 70Q150 35 300 70T600 70T900 70T1200 70V120H0Z"/></svg>
</div>

<main>
  <h1>Would you have survived?</h1>
  <p class="sub">Enter a passenger's details and the model predicts their fate on the Titanic.</p>

  <div class="card">
    <div class="f"><label for="name">Passenger name (optional)</label><input id="name" type="text" placeholder="e.g. Rose"></div>

    <div class="f"><div class="l">Gender</div>
      <div class="seg">
        <input type="radio" name="sex" id="m" value="male" checked><label for="m">Male</label>
        <input type="radio" name="sex" id="fm" value="female"><label for="fm">Female</label>
      </div></div>

    <div class="f"><div class="l">Ticket class</div>
      <div class="seg">
        <input type="radio" name="pclass" id="c1" value="1"><label for="c1">1st</label>
        <input type="radio" name="pclass" id="c2" value="2"><label for="c2">2nd</label>
        <input type="radio" name="pclass" id="c3" value="3" checked><label for="c3">3rd</label>
      </div></div>

    <div class="f"><label for="age">Age <b id="agev">28</b></label><input id="age" type="range" min="1" max="80" value="28"></div>
    <div class="f"><label for="fare">Fare (£) <b id="farev">32</b></label><input id="fare" type="range" min="0" max="520" value="32"></div>

    <div class="two">
      <div class="f"><label for="sibsp">Siblings / spouse aboard</label><input id="sibsp" type="number" min="0" max="8" value="0"></div>
      <div class="f"><label for="parch">Parents / children aboard</label><input id="parch" type="number" min="0" max="6" value="0"></div>
    </div>

    <div class="f"><div class="l">Boarded at</div>
      <div class="seg">
        <input type="radio" name="emb" id="eS" value="S" checked><label for="eS">Southampton</label>
        <input type="radio" name="emb" id="eC" value="C"><label for="eC">Cherbourg</label>
        <input type="radio" name="emb" id="eQ" value="Q"><label for="eQ">Queenstown</label>
      </div></div>

    <button id="go">Check survival</button>

    <div id="res" aria-live="polite">
      <div class="ring" id="ring"><span id="pct">0%</span></div>
      <div id="msg"></div>
      <div id="note">Estimated survival chance</div>
    </div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const val=n=>document.querySelector(`input[name=${n}]:checked`).value;
['age','fare'].forEach(i=>$(i).oninput=()=>$(i+'v').textContent=$(i).value);

$('go').onclick=async()=>{
  const b=$('go');b.disabled=true;b.textContent='Checking...';
  try{
    const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pclass:val('pclass'),sex:val('sex'),age:$('age').value,fare:$('fare').value,
        sibsp:$('sibsp').value||0,parch:$('parch').value||0,embarked:val('emb')})});
    if(!r.ok)throw new Error();
    show(await r.json());
  }catch(e){alert('Could not reach the model. Make sure app.py is running.')}
  b.disabled=false;b.textContent='Check survival';
};

function show(d){
  const who=$('name').value.trim()||'This passenger';
  $('res').classList.add('show');
  $('ring').style.setProperty('--c',d.survived?'#5be0a0':'#ff6b7a');
  $('msg').textContent=d.survived?`${who} makes it onto a lifeboat.`:`${who} does not survive the night.`;
  let t0=null;
  const step=ts=>{t0??=ts;const k=Math.min((ts-t0)/900,1),v=d.probability*k;
    $('ring').style.setProperty('--p',v);$('pct').textContent=Math.round(v)+'%';
    if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
  $('res').scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
